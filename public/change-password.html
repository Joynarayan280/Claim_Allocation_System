<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Set New Password — Case Allocation System</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--paper, #fbfaf5);
      color: var(--ink, #19211d);
      font-family: inherit;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--panel, #ffffff);
      border: 1px solid var(--line, #edebe1);
      border-radius: var(--radius-card, 16px);
      padding: 32px 24px;
      box-shadow: 0 10px 40px rgba(22, 56, 44, .08);
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 6px;
      font-size: 20px;
      font-weight: 800;
      color: var(--ink, #19211d);
      letter-spacing: -0.02em;
    }

    .hint {
      font-size: 12.5px;
      color: var(--ink-soft, #5b6560);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .login-err {
      display: none;
      background: var(--red-bg, #fdf2f2);
      border: 1px solid var(--red-border, #fecaca);
      color: var(--red, #b91c1c);
      padding: 10px 12px;
      border-radius: var(--radius-sm, 8px);
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 14px;
      word-break: break-word;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink, #19211d);
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      font-size: 14px;
      border: 1.5px solid var(--line-strong, #dcd8cb);
      border-radius: var(--radius-md, 10px);
      background: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    .field input:focus {
      border-color: var(--primary, #16382c);
      box-shadow: 0 0 0 3px rgba(22, 56, 44, .12);
    }

    .btn-submit {
      width: 100%;
      min-height: 44px;
      margin-top: 6px;
      font-size: 14px;
      font-weight: 700;
      background: var(--primary, #16382c);
      color: #ffffff;
      border: 1px solid var(--primary, #16382c);
      border-radius: var(--radius-md, 10px);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: var(--primary-hover, #0f271f);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .signout-link {
      display: inline-block;
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--ink-soft, #5b6560);
      text-decoration: none;
      font-weight: 600;
    }

    .signout-link:hover {
      color: var(--ink, #19211d);
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .login-card {
        padding: 24px 18px;
        border-radius: 14px;
      }

      .login-card h2 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h2>Setting a new password</h2>
    <div class="hint">You have logged in using your temporary password. Please first create a new password (at least 8 characters long, including both letters and numbers).</div>
    <div class="login-err" id="err" role="alert"></div>

    <form id="form">
      <div class="field">
        <label for="oldPassword">Temporary (Old) password</label>
        <input type="password" id="oldPassword" autocomplete="current-password" required>
      </div>

      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
      </div>

      <div class="field">
        <label for="newPassword2">New password again</label>
        <input type="password" id="newPassword2" autocomplete="new-password" minlength="8" required>
      </div>

      <button type="submit" class="btn btn-submit" id="btn">Saving password</button>
    </form>

    <div style="text-align: center;">
      <a href="#" class="signout-link" id="logout">Sign out</a>
    </div>
  </main>

  <script>
    (function () {
      const err = document.getElementById('err');
      const show = (m) => {
        err.textContent = m;
        err.style.display = 'block';
      };

      fetch('/api/auth/me').then(function (r) {
        if (r.status === 401) location.href = '/login.html';
      });

      document.getElementById('logout').addEventListener('click', async function (e) {
        e.preventDefault();
        try {
          await fetch('/api/auth/logout', { method: 'POST' });
        } catch (ignored) {}
        location.href = '/login.html';
      });

      document.getElementById('form').addEventListener('submit', async function (e) {
        e.preventDefault();
        err.style.display = 'none';

        const n1 = document.getElementById('newPassword').value;
        const n2 = document.getElementById('newPassword2').value;

        if (n1 !== n2) {
          return show('The two new passwords do not match.');
        }

        const btn = document.getElementById('btn');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        try {
          const res = await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              oldPassword: document.getElementById('oldPassword').value,
              newPassword: n1
            })
          });

          const data = await res.json().catch(function () { return {}; });
          if (!res.ok) throw new Error(data.error || 'It did not save.');

          location.href = data.redirect || '/';
        } catch (ex) {
          show(ex.message);
          btn.disabled = false;
          btn.textContent = 'Saving password';
        }
      });
    })();
  </script>
</body>

</html>
